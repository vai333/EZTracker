name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy eztracker
      - run: .venv/bin/pytest -q
      - name: Migrations + RLS + DB/API integration tests
        working-directory: .
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          export PATH="/usr/lib/postgresql/$(ls /usr/lib/postgresql)/bin:$PATH"
          ./scripts/db_test.sh --seed

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:contrast
      - run: npm test -- --run
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { CI: "1" }
