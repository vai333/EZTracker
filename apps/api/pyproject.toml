[project]
name = "eztracker"
version = "0.1.0"
description = "EZTracker API — personal academic command center for Mesa Nexus"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pymongo>=4.13",
  "httpx>=0.27",
  "playwright>=1.47",
  "selectolax>=0.3.21",
  "tenacity>=9.0",
  "structlog>=24.4",
  "dateparser>=1.2",
  "cryptography>=43",
  "rapidfuzz>=3.9",
  "apscheduler>=3.10,<4",
  "slowapi>=0.1.9",
  "pyjwt[crypto]>=2.9",
  "markdownify>=0.13",
  "nh3>=0.2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.112"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eztracker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
ignore_missing_imports = true
